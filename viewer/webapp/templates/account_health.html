<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Brief · Account Health</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f5f4f1; --surface:#fff; --surface2:#f0efe9; --border:#e2e0d8; --border-strong:#c8c6bc;
  --t1:#1a1916; --t2:#5a5850; --t3:#726f65;
  --accent:#1a5ca0; --accent-bg:#eef3fb; --accent-t:#1a5ca0;
  --good-bg:#eef7ee; --good-t:#2a7a34; --bad-bg:#fef1f0; --bad-t:#b02520;
  --warn-bg:#fdf5e6; --warn-t:#7a5000;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",monospace; --r:5px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181b; --surface:#1e1e22; --surface2:#26262c; --border:#2c2c32; --border-strong:#3c3c44;
  --t1:#e6e4de; --t2:#9a9890; --t3:#8a867b;
  --accent:#5a9de0; --accent-bg:#0f2140; --accent-t:#6aade8;
  --good-bg:#122415; --good-t:#5cc26a; --bad-bg:#280e0e; --bad-t:#e06868;
  --warn-bg:#28200a; --warn-t:#e8a020;
}}
html{font-size:14px;}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.5;padding:24px 16px 60px;max-width:920px;margin:0 auto;}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1.5px solid var(--border-strong);}
.head h1{font-size:19px;font-weight:600;letter-spacing:-.025em;}
.head .sub{font-size:12px;color:var(--t3);}
a.back{font-size:12px;color:var(--accent-t);text-decoration:none;}
a.back:hover{text-decoration:underline;}
.empty{color:var(--t3);font-size:12px;padding:16px 0;text-align:center;}

.stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:150px;background:var(--surface2);border-radius:var(--r);padding:10px 12px;cursor:pointer;border:1px solid transparent;}
.stat:hover{border-color:var(--border-strong);}
.stat-label{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);}
.stat-value{font-size:18px;font-weight:600;color:var(--t1);margin-top:2px;}
.stat-note{font-size:11px;color:var(--t3);margin-top:2px;}

.callout{background:var(--accent-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:20px;}
.callout h2{font-size:11px;font-weight:700;color:var(--accent-t);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.callout ol{list-style:decimal;padding-left:18px;}
.callout li{padding:3px 0;font-size:12.5px;color:var(--t1);}
.hidden{display:none !important;}

.group{margin-bottom:22px;}
.group-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;margin-bottom:10px;border-bottom:1px solid var(--border);}
.group-head .ghead-sub{font-weight:500;text-transform:none;letter-spacing:0;color:var(--t3);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;transition:box-shadow .2s, border-color .2s;}
.card.jump-highlight{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.card-name{font-size:13.5px;font-weight:600;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.badge-needs_attention{background:var(--bad-bg);color:var(--bad-t);}
.badge-watch{background:var(--warn-bg);color:var(--warn-t);}
.badge-healthy{background:var(--good-bg);color:var(--good-t);}
.badge-no_health_data{background:var(--surface2);color:var(--t2);border:1px solid var(--border-strong);}
.pill{font-size:10.5px;color:var(--t2);background:var(--surface2);padding:2px 7px;border-radius:999px;}
.swept-pill{font-size:10.5px;color:var(--t2);margin-left:auto;}

.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-bottom:8px;}
.field-label{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);}
.field-value{font-size:12.5px;color:var(--t1);margin-top:1px;}
.field-value.placeholder{color:var(--t2);font-style:italic;}
.field-note{font-size:11px;color:var(--bad-t);margin-top:2px;}

.risks{margin-bottom:8px;}
.risks-label{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
.risks ul{list-style:none;}
.risks li{font-size:12px;color:var(--t1);padding:2px 0;}
.risk-tag{color:var(--t3);font-size:10.5px;}

.action-items{font-size:12.5px;color:var(--t1);background:var(--surface2);border-radius:var(--r);padding:7px 10px;margin-bottom:8px;}
.action-items-label{font-weight:600;color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;}
.action-items.placeholder{color:var(--t2);font-style:italic;}
.action-items ul{list-style:none;}
.action-items li{padding:2px 0;}
.action-items a.asana-link{margin-left:6px;font-size:10.5px;color:var(--accent-t);text-decoration:none;white-space:nowrap;}
.action-items a.asana-link:hover{text-decoration:underline;}

.card-footer{display:flex;gap:14px;}
.card-footer a{font-size:11px;color:var(--accent-t);text-decoration:none;}
.card-footer a:hover{text-decoration:underline;}

.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
.panel{background:var(--surface);border-radius:var(--r);max-width:560px;width:100%;max-height:80vh;overflow-y:auto;padding:16px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.panel-head h2{font-size:14px;font-weight:600;}
.panel-close{font-size:12px;color:var(--t3);cursor:pointer;background:none;border:none;font-family:var(--font);}
.panel-row{display:flex;flex-direction:column;gap:2px;padding:9px 8px;border-radius:var(--r);cursor:pointer;}
.panel-row:hover{background:var(--surface2);}
.panel-row-top{display:flex;align-items:center;gap:8px;}
.panel-row-name{font-size:12.5px;font-weight:600;}
.panel-row-step{font-size:11.5px;color:var(--t2);}
.panel-row-note{font-size:11px;color:var(--t3);}
</style>
</head>
<body>

<div class="head">
  <div>
    <a class="back" href="{{ url_for('index') }}">&larr; Back to briefs</a>
    <h1>Account Health</h1>
    <div class="sub">Signed in as {{ user_email }} &middot; <span id="ah-count">Loading&hellip;</span></div>
  </div>
</div>

<div class="stat-row" id="ah-stats"></div>
<div class="callout hidden" id="ah-callout">
  <h2>This week</h2>
  <ol id="ah-callout-list"></ol>
</div>

<div id="ah-body"><div class="empty">Loading&hellip;</div></div>

<div class="panel-backdrop hidden" id="ah-panel-backdrop">
  <div class="panel">
    <div class="panel-head">
      <h2 id="ah-panel-title"></h2>
      <button type="button" class="panel-close" id="ah-panel-close">Close</button>
    </div>
    <div id="ah-panel-rows"></div>
  </div>
</div>

<script>
const BASE = document.querySelector('base')?.href || '';
let PAGE_DATA = null;

function todayLocalIso() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const HEALTH_LABELS = {needs_attention: 'Needs Attention', watch: 'Watch', healthy: 'Healthy', no_health_data: 'No Health Data'};

function healthBadge(group) {
  return `<span class="badge badge-${esc(group)}">${esc(HEALTH_LABELS[group] || group)}</span>`;
}

function fieldValue(value, placeholderText) {
  if (value === null || value === undefined || value === '') {
    return `<div class="field-value placeholder">${esc(placeholderText)}</div>`;
  }
  return `<div class="field-value">${esc(value)}</div>`;
}

function actionItemsListHtml(items, placeholderText) {
  if (!items || !items.length) {
    return `<div class="action-items placeholder"><span class="action-items-label">Action items</span>${esc(placeholderText)}</div>`;
  }
  return `<div class="action-items"><span class="action-items-label">Action items</span><ul>${items.map(item =>
    `<li>${esc(item.text)}${item.source === 'context_doc' ? ' <span class="risk-tag">[Context Doc]</span>' : ''}${item.asana_url ? ` <a class="asana-link" href="${esc(item.asana_url)}" target="_blank">Open in Asana &rarr;</a>` : ''}</li>`
  ).join('')}</ul></div>`;
}

function firstActionItemText(account) {
  const items = account.action_items;
  return (items && items.length) ? items[0].text : (account.no_doc ? 'No research yet' : 'Not captured this sweep');
}

function renderCard(account) {
  const placeholder = account.no_doc ? 'No research yet' : 'Not captured this sweep';
  const arr = account.arr || {};
  const arrDisplay = arr.raw ? `${arr.raw}${arr.disputed ? ' (disputed)' : ''}` : null;
  const risksHtml = (account.risks && account.risks.length)
    ? `<div class="risks"><div class="risks-label">Risks</div><ul>${account.risks.map(r =>
        `<li>${esc(r.text)}${r.source_tag ? ` <span class="risk-tag">[${esc(r.source_tag)}]</span>` : ''}</li>`
      ).join('')}</ul></div>`
    : '';
  const actionItemsHtml = actionItemsListHtml(account.action_items, placeholder);
  const refreshHref = `claude://claude.ai/new?q=${encodeURIComponent(account.refresh_query)}`;
  const docLink = account.doc_url
    ? `<a href="${esc(account.doc_url)}" target="_blank">Open Context doc &rarr;</a>`
    : '';

  return `
    <div class="card" data-account-name="${esc(account.account_name)}">
      <div class="card-top">
        <span class="card-name">${esc(account.account_name)}</span>
        ${healthBadge(account.health_group)}
        ${account.commercial_tier ? `<span class="pill">${esc(account.commercial_tier)}</span>` : ''}
        <span class="swept-pill">${esc(account.swept_label)}</span>
      </div>
      <div class="field-grid">
        <div><div class="field-label">ARR</div>${fieldValue(arrDisplay, placeholder)}${arr.disputed && arr.note ? `<div class="field-note">${esc(arr.note)}</div>` : ''}</div>
        <div><div class="field-label">Renewal</div>${fieldValue(account.renewal, placeholder)}</div>
        <div><div class="field-label">Health</div>${fieldValue((account.health_signals || []).join(', ') || null, placeholder)}${account.health_disagree ? '<div class="field-note">Scores disagree</div>' : ''}</div>
        <div><div class="field-label">CSM</div>${fieldValue(account.csm, placeholder)}</div>
        <div><div class="field-label">AE</div>${fieldValue(account.ae, placeholder)}</div>
        <div><div class="field-label">TAM</div>${fieldValue(account.tam, placeholder)}</div>
      </div>
      ${risksHtml}
      ${actionItemsHtml}
      <div class="card-footer">
        ${docLink}
        <a href="${refreshHref}" target="_blank">Refresh research</a>
      </div>
    </div>`;
}

function renderGroups(groups) {
  const body = document.getElementById('ah-body');
  if (!groups.some(g => g.count > 0)) {
    body.innerHTML = '<div class="empty">No accounts configured yet.</div>';
    return;
  }
  body.innerHTML = groups.map(g => `
    <div class="group">
      <div class="group-head">
        <span>${esc(g.label)} (${g.count})</span>
        <span class="ghead-sub">${esc(g.arr_subtotal_raw)} ARR</span>
      </div>
      ${g.accounts.length ? g.accounts.map(renderCard).join('') : '<div class="empty">None</div>'}
    </div>
  `).join('');
}

function renderStatTiles(stats) {
  const tiles = [
    {key: 'accounts', label: 'Accounts', value: stats.accounts_count},
    {key: 'arr', label: 'Combined ARR', value: stats.combined_arr_raw,
     note: stats.combined_arr_disputed_count > 0 ? `${stats.combined_arr_disputed_count} figure(s) disputed` : null},
    {key: 'needs-attention', label: 'Needs Attention', value: stats.needs_attention_count},
    {key: 'stale', label: 'Stale Data (>30d)', value: stats.stale_count},
  ];
  document.getElementById('ah-stats').innerHTML = tiles.map(t => `
    <div class="stat" data-tile="${t.key}">
      <div class="stat-label">${esc(t.label)}</div>
      <div class="stat-value">${esc(t.value)}</div>
      ${t.note ? `<div class="stat-note">${esc(t.note)}</div>` : ''}
    </div>
  `).join('');

  document.querySelectorAll('#ah-stats .stat').forEach(el => {
    el.addEventListener('click', () => openPanel(el.dataset.tile));
  });
}

function renderCallout(callout) {
  const box = document.getElementById('ah-callout');
  if (!callout || !callout.findings || !callout.findings.length) {
    box.classList.add('hidden');
    return;
  }
  document.getElementById('ah-callout-list').innerHTML = callout.findings.map(f => `<li>${esc(f)}</li>`).join('');
  box.classList.remove('hidden');
}

function allAccounts() {
  return (PAGE_DATA.groups || []).flatMap(g => g.accounts);
}

const TILE_FILTERS = {
  'accounts': {title: 'All accounts', match: () => true, note: a => a.swept_label},
  'arr': {title: 'Disputed ARR', match: a => a.arr && a.arr.disputed, note: a => (a.arr && a.arr.note) || ''},
  'needs-attention': {title: 'Needs Attention', match: a => a.health_group === 'needs_attention', note: a => a.swept_label},
  'stale': {title: 'Stale Data (>30d)', match: a => a.swept_days !== null && a.swept_days !== undefined && a.swept_days > 30, note: a => a.swept_label},
};

function openPanel(tileKey) {
  const filter = TILE_FILTERS[tileKey];
  if (!filter || !PAGE_DATA) return;
  const matches = allAccounts().filter(filter.match);

  document.getElementById('ah-panel-title').textContent = filter.title;
  document.getElementById('ah-panel-rows').innerHTML = matches.length
    ? matches.map(a => `
        <div class="panel-row" data-account-name="${esc(a.account_name)}">
          <div class="panel-row-top">
            <span class="panel-row-name">${esc(a.account_name)}</span>
            ${healthBadge(a.health_group)}
          </div>
          <div class="panel-row-step">${esc(firstActionItemText(a))}</div>
          <div class="panel-row-note">${esc(filter.note(a))}</div>
        </div>
      `).join('')
    : '<div class="empty">No matching accounts.</div>';

  document.querySelectorAll('#ah-panel-rows .panel-row').forEach(el => {
    el.addEventListener('click', () => jumpToCard(el.dataset.accountName));
  });

  document.getElementById('ah-panel-backdrop').classList.remove('hidden');
}

function closePanel() {
  document.getElementById('ah-panel-backdrop').classList.add('hidden');
}

function jumpToCard(accountName) {
  closePanel();
  const card = document.querySelector(`.card[data-account-name="${CSS.escape(accountName)}"]`);
  if (!card) return;
  card.scrollIntoView({behavior: 'smooth', block: 'center'});
  card.classList.add('jump-highlight');
  setTimeout(() => card.classList.remove('jump-highlight'), 1600);
}

document.getElementById('ah-panel-close').addEventListener('click', closePanel);
document.getElementById('ah-panel-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'ah-panel-backdrop') closePanel();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});

async function load() {
  const body = document.getElementById('ah-body');
  body.innerHTML = '<div class="empty">Loading&hellip;</div>';
  try {
    const r = await fetch(`${BASE}api/account-health/${todayLocalIso()}`, {credentials: 'include'});
    if (!r.ok) {
      let message = r.statusText;
      try { message = (await r.json()).error || message; } catch (_) { /* non-JSON error body (e.g. a login redirect) */ }
      throw new Error(message);
    }
    const data = await r.json();
    PAGE_DATA = data;
    document.getElementById('ah-count').textContent = `${data.stat_tiles.accounts_count} account(s)`;
    renderStatTiles(data.stat_tiles);
    renderCallout(data.callout);
    renderGroups(data.groups);
  } catch (e) {
    body.innerHTML = `<div class="empty" style="color:var(--bad-t)">Failed to load: ${esc(e.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
