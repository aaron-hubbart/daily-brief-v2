<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Brief · Manage Customers</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f5f4f1; --surface:#fff; --surface2:#f0efe9; --border:#e2e0d8; --border-strong:#c8c6bc;
  --t1:#1a1916; --t2:#5a5850; --t3:#9a9890;
  --accent:#1a5ca0; --accent-bg:#eef3fb; --accent-t:#1a5ca0;
  --good-bg:#eef7ee; --good-t:#2a7a34; --bad-bg:#fef1f0; --bad-t:#b02520;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",monospace; --r:5px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181b; --surface:#1e1e22; --surface2:#26262c; --border:#2c2c32; --border-strong:#3c3c44;
  --t1:#e6e4de; --t2:#9a9890; --t3:#5a5850;
  --accent:#5a9de0; --accent-bg:#0f2140; --accent-t:#6aade8;
  --good-bg:#122415; --good-t:#5cc26a; --bad-bg:#280e0e; --bad-t:#e06868;
}}
html{font-size:14px;}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.5;padding:24px 16px 60px;max-width:1060px;margin:0 auto;}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1.5px solid var(--border-strong);}
.head h1{font-size:19px;font-weight:600;letter-spacing:-.025em;}
.head .sub{font-size:12px;color:var(--t3);}
a.back{font-size:12px;color:var(--accent-t);text-decoration:none;}
a.back:hover{text-decoration:underline;}
.panel{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:20px;overflow:hidden;}
.panel-head{padding:10px 14px;background:var(--surface2);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;justify-content:space-between;align-items:center;}
.panel-body{padding:12px 14px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:6px 8px;border-bottom:1px solid var(--border-strong);}
td{padding:7px 8px;border-bottom:.5px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.editing td{background:var(--accent-bg);}
.acct-name{font-weight:500;}
.mono{font-family:var(--mono);font-size:11px;color:var(--t3);}
.sub{display:block;font-size:10px;opacity:.6;}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:99px;display:inline-block;}
.pill.primary{background:var(--accent-bg);color:var(--accent-t);}
.pill.secondary{background:var(--surface2);color:var(--t2);}
.day-tag{font-size:11px;color:var(--t2);}
select,input[type="text"]{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--t1);}
select{cursor:pointer;}
.btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:var(--r);border:.5px solid var(--border-strong);background:var(--surface);color:var(--t2);cursor:pointer;}
.btn:hover{filter:brightness(.95);}
.btn.primary{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-t);}
.btn.danger{border-color:var(--bad-t);color:var(--bad-t);background:var(--bad-bg);}
.btn.save{background:var(--good-bg);border-color:var(--good-t);color:var(--good-t);}
.btn:disabled{opacity:.4;cursor:default;}
.actions{display:flex;gap:6px;}
.msg{font-size:11.5px;color:var(--t3);margin-top:10px;min-height:1.2em;}
.msg.ok{color:var(--good-t);}
.msg.err{color:var(--bad-t);}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
.internal-gid{font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.internal-gid label{font-weight:500;font-size:12px;}
.internal-gid input{width:220px;}
.empty{color:var(--t3);font-size:12px;padding:16px 0;text-align:center;}
.section-head td{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);background:var(--surface2);padding:8px 8px;border-bottom:1px solid var(--border-strong);}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.add-row input{flex:1;min-width:140px;}
.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;}
.toast{padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:500;pointer-events:auto;
  opacity:0;transform:translateY(-12px);animation:toast-in .25s ease forwards;}
.toast.ok{background:var(--good-bg);color:var(--good-t);border:1px solid var(--good-t);}
.toast.err{background:var(--bad-bg);color:var(--bad-t);border:1px solid var(--bad-t);}
.toast.out{animation:toast-out .25s ease forwards;}
@keyframes toast-in{to{opacity:1;transform:translateY(0);}}
@keyframes toast-out{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-12px);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--surface);border-radius:var(--r);max-width:600px;width:90%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border-strong);}
.modal-head{padding:12px 16px;background:var(--surface2);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1;}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.scan-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--border);}
.scan-row input[type="text"]{flex:1;}
.scan-row .mono{white-space:nowrap;}
</style>
</head>
<body>
<div class="toast-container" id="toast-container"></div>

<div class="modal-overlay" id="scan-modal" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <span>Discovered Asana Projects</span>
      <button class="btn" onclick="closeScanModal()">Close</button>
    </div>
    <div class="modal-body" id="scan-body"></div>
    <div class="modal-foot">
      <button class="btn primary" onclick="addScannedAccounts()">Add Selected</button>
    </div>
  </div>
</div>

<div class="head">
  <div>
    <a class="back" href="{{ url_for('index') }}">&larr; Back to briefs</a>
    <h1>Manage Customers</h1>
    <div class="sub">Signed in as {{ user_email }}</div>
  </div>
</div>

<div class="internal-gid">
  <label>Internal Asana Project:</label>
  <input type="text" id="internal-name" placeholder="Project name" style="width:200px">
  <input type="text" id="internal-gid" placeholder="Project GID" class="mono" style="width:200px">
  <label>Default Section:</label>
  <input type="text" id="internal-section" placeholder="Section name" style="width:160px">
</div>

<div class="panel">
  <div class="panel-head">
    <span>Account List</span>
    <div style="display:flex;gap:8px">
      <button class="btn" id="scan-btn" onclick="scanForAccounts()">Scan for Accounts</button>
      <button class="btn save" id="save-btn" onclick="saveConfig()" disabled>Save to Drive</button>
    </div>
  </div>
  <div class="panel-body">
    <table>
      <thead>
        <tr>
          <th>Account Name</th>
          <th>Tier</th>
          <th>Run Day</th>
          <th>Slack Channel</th>
          <th>Asana Project</th>
          <th>Default Section</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="acct-body">
        <tr><td colspan="7" class="empty">Loading…</td></tr>
      </tbody>
    </table>
    <div class="add-row">
      <input type="text" id="new-name" placeholder="Account name">
      <select id="new-tier">
        <option value="primary">Primary</option>
        <option value="secondary">Secondary</option>
      </select>
      <select id="new-day" disabled>
        <option value="">—</option>
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
      <input type="text" id="new-slack-name" placeholder="Slack channel name"><input type="text" id="new-slack" placeholder="Slack Channel ID" class="mono">
      <input type="text" id="new-asana-name" placeholder="Asana project name"><input type="text" id="new-gid" placeholder="Asana Project GID" class="mono">
      <input type="text" id="new-section" placeholder="Default section name">
      <button class="btn primary" onclick="addAccount()">Add account</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const BASE = document.querySelector('base')?.href || '';
let CONFIG = null;
let dirty = false;

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

document.getElementById('new-tier').addEventListener('change', function() {
  document.getElementById('new-day').disabled = this.value !== 'secondary';
});

document.getElementById('internal-gid').addEventListener('input', () => markDirty());
document.getElementById('internal-name').addEventListener('input', () => markDirty());
document.getElementById('internal-section').addEventListener('input', () => markDirty());

async function load() {
  try {
    const r = await fetch(`${BASE}api/customers/config`, {credentials:'include'});
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    CONFIG = await r.json();
    CONFIG.accounts = (CONFIG.accounts || []).sort((a,b) =>
      (a.account_name||'').localeCompare(b.account_name||'', undefined, {sensitivity:'base'})
    );
    document.getElementById('internal-gid').value = CONFIG.internal_project_gid || '';
    document.getElementById('internal-name').value = CONFIG.internal_project_name || '';
    document.getElementById('internal-section').value = CONFIG.internal_default_section_name || '';
    render();
  } catch(e) {
    document.getElementById('acct-body').innerHTML =
      `<tr><td colspan="7" class="empty" style="color:var(--bad-t)">Failed to load: ${e.message}</td></tr>`;
  }
}

function render() {
  const tbody = document.getElementById('acct-body');
  if (!CONFIG.accounts.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No accounts configured</td></tr>';
    return;
  }
  const primary = [];
  const secondary = [];
  CONFIG.accounts.forEach((a, i) => {
    const entry = {a, i};
    if (a.tier === 'secondary') secondary.push(entry);
    else primary.push(entry);
  });

  function rowsHtml(entries) {
    if (!entries.length) return '<tr><td colspan="7" class="empty">None</td></tr>';
    return entries.map(({a, i}) => `
      <tr data-idx="${i}">
        <td class="acct-name">${esc(a.account_name || '')}</td>
        <td><span class="pill ${a.tier || 'primary'}">${a.tier || 'primary'}</span></td>
        <td class="day-tag">${a.tier === 'secondary' && a.run_day ? a.run_day : '—'}</td>
        <td>${a.slack_channel_name ? esc(a.slack_channel_name) : ''}<span class="mono sub">${a.slack_channel_id ? (a.slack_channel_name ? ' ' : '') + esc(a.slack_channel_id) : '—'}</span></td>
        <td>${a.asana_board_name ? esc(a.asana_board_name) : ''}<span class="mono sub">${a.project_gid ? (a.asana_board_name ? ' ' : '') + esc(a.project_gid) : '—'}</span></td>
        <td>${a.default_section_name ? esc(a.default_section_name) : '—'}</td>
        <td class="actions">
          <button class="btn" onclick="editRow(${i})">Edit</button>
          <button class="btn danger" onclick="removeRow(${i})">Remove</button>
        </td>
      </tr>
    `).join('');
  }

  tbody.innerHTML =
    `<tr class="section-head"><td colspan="7">Primary Accounts (${primary.length})</td></tr>` +
    rowsHtml(primary) +
    `<tr class="section-head"><td colspan="7">Secondary Accounts (${secondary.length})</td></tr>` +
    rowsHtml(secondary);
}

function editRow(idx) {
  const a = CONFIG.accounts[idx];
  const tbody = document.getElementById('acct-body');
  const tr = tbody.querySelector(`tr[data-idx="${idx}"]`);
  const secSel = a.tier === 'secondary';
  tr.className = 'editing';
  tr.innerHTML = `
    <td><input type="text" id="e-name" value="${esc(a.account_name||'')}" style="width:100%"></td>
    <td><select id="e-tier" onchange="document.getElementById('e-day').disabled=this.value!=='secondary'">
      <option value="primary" ${a.tier!=='secondary'?'selected':''}>Primary</option>
      <option value="secondary" ${a.tier==='secondary'?'selected':''}>Secondary</option>
    </select></td>
    <td><select id="e-day" ${secSel?'':'disabled'}>
      <option value="">—</option>
      ${DAYS.map(d=>`<option ${a.run_day===d?'selected':''}>${d}</option>`).join('')}
    </select></td>
    <td><input type="text" id="e-slack-name" value="${esc(a.slack_channel_name||'')}" placeholder="Channel name" style="width:100%;margin-bottom:4px"><input type="text" id="e-slack" value="${esc(a.slack_channel_id||'')}" placeholder="Channel ID" class="mono" style="width:100%;font-size:10px"></td>
    <td><input type="text" id="e-asana-name" value="${esc(a.asana_board_name||'')}" placeholder="Project name" style="width:100%;margin-bottom:4px"><input type="text" id="e-gid" value="${esc(a.project_gid||'')}" placeholder="Project GID" class="mono" style="width:100%;font-size:10px"></td>
    <td><input type="text" id="e-section" value="${esc(a.default_section_name||'')}" placeholder="Section name" style="width:100%"></td>
    <td class="actions">
      <button class="btn save" onclick="saveRow(${idx})">OK</button>
      <button class="btn" onclick="render()">Cancel</button>
    </td>
  `;
}

function saveRow(idx) {
  const a = CONFIG.accounts[idx];
  a.account_name = document.getElementById('e-name').value.trim();
  a.tier = document.getElementById('e-tier').value;
  a.run_day = a.tier === 'secondary' ? (document.getElementById('e-day').value || null) : null;
  a.slack_channel_name = document.getElementById('e-slack-name').value.trim() || '';
  a.slack_channel_id = document.getElementById('e-slack').value.trim() || '';
  a.asana_board_name = document.getElementById('e-asana-name').value.trim() || '';
  a.project_gid = document.getElementById('e-gid').value.trim() || '';
  a.default_section_name = document.getElementById('e-section').value.trim() || '';
  CONFIG.accounts.sort((a,b) =>
    (a.account_name||'').localeCompare(b.account_name||'', undefined, {sensitivity:'base'})
  );
  markDirty();
  render();
}

function addAccount() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  const tier = document.getElementById('new-tier').value;
  const day = tier === 'secondary' ? (document.getElementById('new-day').value || null) : null;
  const slackName = document.getElementById('new-slack-name').value.trim();
  const slack = document.getElementById('new-slack').value.trim();
  const asanaName = document.getElementById('new-asana-name').value.trim();
  const gid = document.getElementById('new-gid').value.trim();
  const sectionName = document.getElementById('new-section').value.trim();
  CONFIG.accounts.push({
    account_name: name, tier: tier, run_day: day,
    slack_channel_name: slackName, slack_channel_id: slack, supporting_slack_channel_ids: [],
    asana_board_name: asanaName, project_gid: gid, default_section_name: sectionName, gdrive_folder_id: null
  });
  CONFIG.accounts.sort((a,b) =>
    (a.account_name||'').localeCompare(b.account_name||'', undefined, {sensitivity:'base'})
  );
  document.getElementById('new-name').value = '';
  document.getElementById('new-slack-name').value = '';
  document.getElementById('new-slack').value = '';
  document.getElementById('new-asana-name').value = '';
  document.getElementById('new-gid').value = '';
  document.getElementById('new-section').value = '';
  markDirty();
  render();
}

function removeRow(idx) {
  const name = CONFIG.accounts[idx].account_name || 'this account';
  if (!confirm(`Remove ${name}?`)) return;
  CONFIG.accounts.splice(idx, 1);
  markDirty();
  render();
}

function markDirty() {
  dirty = true;
  document.getElementById('save-btn').disabled = false;
  document.getElementById('msg').textContent = 'Unsaved changes';
  document.getElementById('msg').className = 'msg';
}

function showToast(text, type, duration) {
  duration = duration || 5000;
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = text;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove());
  }, duration);
}

async function saveConfig() {
  const btn = document.getElementById('save-btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = 'Saving…';
  msg.className = 'msg';

  CONFIG.internal_project_name = document.getElementById('internal-name').value.trim() || '';
  CONFIG.internal_project_gid = document.getElementById('internal-gid').value.trim() || '';
  CONFIG.internal_default_section_name = document.getElementById('internal-section').value.trim() || '';

  try {
    const r = await fetch(`${BASE}api/customers/config`, {
      method: 'PUT', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(CONFIG)
    });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    dirty = false;
    msg.textContent = '';
    msg.className = 'msg';
    showToast('Configuration saved to Drive', 'ok', 5000);
  } catch(e) {
    msg.textContent = '';
    msg.className = 'msg';
    showToast('Save failed: ' + e.message, 'err', 5000);
    btn.disabled = false;
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

let SCAN_CANDIDATES = [];

async function scanForAccounts() {
  const modal = document.getElementById('scan-modal');
  const body = document.getElementById('scan-body');
  modal.style.display = 'flex';
  body.innerHTML = '<div class="empty">Scanning Asana…</div>';
  try {
    const r = await fetch(`${BASE}api/customers/discover-asana`, {credentials:'include'});
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const data = await r.json();
    SCAN_CANDIDATES = data.candidates || [];
    renderScanResults();
  } catch(e) {
    body.innerHTML = `<div class="empty" style="color:var(--bad-t)">${esc(e.message)}</div>`;
  }
}

function renderScanResults() {
  const body = document.getElementById('scan-body');
  if (!SCAN_CANDIDATES.length) {
    body.innerHTML = '<div class="empty">No new Asana projects found — everything visible to your Asana account is already linked. Note: this only scans Asana; use the skill\'s "find new accounts" to also scan Slack and email.</div>';
    return;
  }
  body.innerHTML = SCAN_CANDIDATES.map((c, i) => `
    <div class="scan-row">
      <input type="checkbox" id="scan-check-${i}">
      <input type="text" id="scan-name-${i}" value="${escAttr(c.name)}" placeholder="Account name">
      <span class="mono sub">${esc(c.gid)}</span>
    </div>
  `).join('');
}

function closeScanModal() {
  document.getElementById('scan-modal').style.display = 'none';
}

function addScannedAccounts() {
  let added = 0;
  SCAN_CANDIDATES.forEach((c, i) => {
    const checkbox = document.getElementById(`scan-check-${i}`);
    if (!checkbox || !checkbox.checked) return;
    const name = document.getElementById(`scan-name-${i}`).value.trim();
    if (!name) return;
    CONFIG.accounts.push({
      account_name: name, tier: 'primary', run_day: null,
      slack_channel_name: '', slack_channel_id: '', supporting_slack_channel_ids: [],
      asana_board_name: c.name, project_gid: c.gid, default_section_name: '', gdrive_folder_id: null
    });
    added++;
  });
  CONFIG.accounts.sort((a,b) =>
    (a.account_name||'').localeCompare(b.account_name||'', undefined, {sensitivity:'base'})
  );
  closeScanModal();
  if (added > 0) {
    markDirty();
    render();
    showToast(`Added ${added} account${added===1?'':'s'} — click "Save to Drive" to persist`, 'ok', 5000);
  }
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

load();
</script>
</body>
</html>
