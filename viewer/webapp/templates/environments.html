<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Brief · Environments</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f5f4f1; --surface:#fff; --surface2:#f0efe9; --border:#e2e0d8; --border-strong:#c8c6bc;
  --t1:#1a1916; --t2:#5a5850; --t3:#9a9890;
  --accent:#1a5ca0; --accent-bg:#eef3fb; --accent-t:#1a5ca0;
  --good-bg:#eef7ee; --good-t:#2a7a34; --bad-bg:#fef1f0; --bad-t:#b02520;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",monospace; --r:5px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181b; --surface:#1e1e22; --surface2:#26262c; --border:#2c2c32; --border-strong:#3c3c44;
  --t1:#e6e4de; --t2:#9a9890; --t3:#5a5850;
  --accent:#5a9de0; --accent-bg:#0f2140; --accent-t:#6aade8;
  --good-bg:#122415; --good-t:#5cc26a; --bad-bg:#280e0e; --bad-t:#e06868;
}}
html{font-size:14px;}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.5;padding:24px 16px 60px;max-width:900px;margin:0 auto;}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1.5px solid var(--border-strong);}
.head h1{font-size:19px;font-weight:600;letter-spacing:-.025em;}
.head .sub{font-size:12px;color:var(--t3);}
a.back{font-size:12px;color:var(--accent-t);text-decoration:none;}
a.back:hover{text-decoration:underline;}
.hint{font-size:12.5px;color:var(--t3);padding:12px 0;}
.empty{color:var(--t3);font-size:12px;padding:16px 0;text-align:center;}
select,input[type="text"],input[type="date"],textarea{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--t1);}
textarea{width:100%;min-height:52px;resize:vertical;}
.btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:var(--r);border:.5px solid var(--border-strong);background:var(--surface);color:var(--t2);cursor:pointer;}
.btn:hover{filter:brightness(.95);}
.btn.primary{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-t);}
.btn.danger{border-color:var(--bad-t);color:var(--bad-t);background:var(--bad-bg);}
.btn.save{background:var(--good-bg);border-color:var(--good-t);color:var(--good-t);}
.btn:disabled{opacity:.4;cursor:default;}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.customer-select{min-width:260px;}
.region-select{min-width:140px;}
.toggle-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:var(--r);border:.5px solid var(--border-strong);background:var(--surface);color:var(--t2);cursor:pointer;}
.toggle-btn:hover{filter:brightness(.95);}
.toggle-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-t);}
.panel{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:16px;overflow:hidden;}
.panel-head{padding:10px 14px;background:var(--surface2);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);display:flex;justify-content:space-between;align-items:center;}
.panel-body{padding:12px 14px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:6px 8px;border-bottom:1px solid var(--border-strong);}
td{padding:7px 8px;border-bottom:.5px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.add-row input{flex:1;min-width:120px;}
.env-card{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.env-card-head{padding:8px 12px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;}
.env-card-body{padding:10px 12px;}
.env-group{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.group-head{padding:8px 12px;background:var(--surface2);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);}
.group-body{padding:10px 12px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.field-grid label,.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
.field-grid input,.field-grid select{width:100%;}
.field{margin-bottom:10px;}
.team-checks label{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--t1);margin-right:12px;margin-bottom:4px;}
.dated-list-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.dated-list-row input{flex:1;}
.dated-list-row input.date-input{flex:0 0 130px;}
.dated-list-row input.ticket-input{flex:0 0 110px;}
.team-card{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.team-card-head{padding:8px 12px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.team-card-head input{flex:1;font-weight:600;font-size:12.5px;}
.team-card-body{padding:10px 12px;}
.caret-btn{border:none;background:none;cursor:pointer;font-size:11px;color:var(--t3);padding:2px 4px;line-height:1;}
.caret-btn:hover{color:var(--t1);}
.collapsible-body.collapsed{display:none;}
.member-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.member-row input{flex:1;min-width:100px;}
.add-team-panel{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;}
.env-pick-list{display:flex;flex-direction:column;gap:4px;margin:6px 0;}
.env-pick-list label{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--t1);}
.pending-env-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.pending-env-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--accent-bg);color:var(--accent-t);border:1px solid var(--accent);border-radius:99px;padding:2px 8px 2px 10px;}
.pending-env-chip button{border:none;background:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0;}
.save-status{font-size:11.5px;color:var(--t3);}
.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;}
.toast{padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:500;pointer-events:auto;
  opacity:0;transform:translateY(-12px);animation:toast-in .25s ease forwards;}
.toast.ok{background:var(--good-bg);color:var(--good-t);border:1px solid var(--good-t);}
.toast.err{background:var(--bad-bg);color:var(--bad-t);border:1px solid var(--bad-t);}
.toast.out{animation:toast-out .25s ease forwards;}
@keyframes toast-in{to{opacity:1;transform:translateY(0);}}
@keyframes toast-out{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-12px);}}
</style>
</head>
<body>
<div class="toast-container" id="toast-container"></div>

<div class="head">
  <div>
    <a class="back" href="{{ url_for('index') }}">&larr; Back to briefs</a>
    <h1>Environments</h1>
    <div class="sub">Signed in as {{ user_email }}</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="save-status" id="save-status"></span>
    <button class="btn save" id="save-btn" onclick="saveAll()" disabled>Save to Drive</button>
  </div>
</div>

<div class="toolbar">
  <label for="customer-select" style="font-size:12px;font-weight:500;">Customer:</label>
  <select class="customer-select" id="customer-select" onchange="onCustomerChange()">
    <option value="">Loading…</option>
  </select>
  <label for="region-filter" style="font-size:12px;font-weight:500;">Region:</label>
  <select class="region-select" id="region-filter" onchange="onRegionFilterChange()">
    <option value="">All regions</option>
  </select>
  <button type="button" class="toggle-btn" id="my-customers-toggle" onclick="toggleMyCustomers()">My Customers</button>
</div>

<div id="content"><div class="empty">Loading&hellip;</div></div>

<script>
const BASE = document.querySelector('base')?.href || '';
let STATE = null;
let CURRENT = null;
let dirty = false;

const COMPONENT_OPTIONS = ['Zeebe', 'Operate', 'Tasklist', 'Optimize', 'Connectors'];
const STANDARD_ENV_NAMES = ['Production', 'Staging', 'QA/Test', 'Development', 'Sandbox', 'DR/Failover'];

let MY_CUSTOMER_NAMES = new Set();
let filterRegion = localStorage.getItem('env-tab:region') || '';
let filterMyCustomers = localStorage.getItem('env-tab:my-customers') === '1';
let addTeamDraft = {existingEnvIds: new Set(), newEnvs: []};

let expandedIds = new Set();

function expandedStorageKey(name) {
  return `env-tab:expanded:${name}`;
}

function loadExpandedIds(name) {
  try {
    const raw = localStorage.getItem(expandedStorageKey(name));
    expandedIds = new Set(raw ? JSON.parse(raw) : []);
  } catch(e) {
    expandedIds = new Set();
  }
}

function saveExpandedIds() {
  try {
    localStorage.setItem(expandedStorageKey(CURRENT), JSON.stringify(Array.from(expandedIds)));
  } catch(e) { /* localStorage unavailable — collapse state just won't persist */ }
}

function isExpanded(id) {
  return expandedIds.has(id);
}

function toggleExpanded(id) {
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  saveExpandedIds();
  renderCustomer();
}

function caretHtml(id) {
  return `<button type="button" class="caret-btn" data-toggle-id="${escAttr(id)}" aria-label="Toggle">${isExpanded(id) ? '▾' : '▸'}</button>`;
}

function wireCarets() {
  document.querySelectorAll('.caret-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleExpanded(this.dataset.toggleId);
    });
  });
}

function normalizeTeam(team) {
  team.id = team.id || ('team-' + Date.now());
  team.notes = team.notes || '';
  team.members = team.members || [];
  return team;
}

function normalizeEnvironment(env) {
  env.id = env.id || ('env-' + Date.now());
  env.label = env.label || '(unlabeled environment)';
  env.team_ids = env.team_ids || [];
  env.deployment = env.deployment || {};
  env.deployment.model = env.deployment.model || 'SaaS';
  env.deployment.install_method = env.deployment.install_method || '';
  env.deployment.region = env.deployment.region || '';
  env.deployment.multi_tenancy = env.deployment.multi_tenancy || '';
  env.deployment.sizing = env.deployment.sizing || '';
  env.versions = env.versions || {};
  env.versions.camunda_version = env.versions.camunda_version || '';
  env.versions.components = env.versions.components || [];
  env.links = env.links || {};
  env.links.console_url = env.links.console_url || '';
  env.links.cluster_urls = env.links.cluster_urls || [];
  env.links.support_plan = env.links.support_plan || '';
  env.links.runbook_links = env.links.runbook_links || [];
  env.notes = env.notes || '';
  env.diagnostic_reports = env.diagnostic_reports || [];
  env.helm_values = env.helm_values || [];
  return env;
}

async function load() {
  try {
    const [envResp, custResp] = await Promise.all([
      fetch(`${BASE}api/environments/config`, {credentials:'include'}),
      fetch(`${BASE}api/customers/config`, {credentials:'include'}).catch(() => null),
    ]);
    if (!envResp.ok) throw new Error((await envResp.json()).error || envResp.statusText);
    STATE = await envResp.json();
    if (custResp && custResp.ok) {
      const custConfig = await custResp.json();
      MY_CUSTOMER_NAMES = new Set((custConfig.accounts || []).map(a => a.account_name));
    }
    renderCustomerSelect();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="empty" style="color:var(--bad-t)">Failed to load: ${e.message}</div>`;
  }
}

function allRegions() {
  const regions = new Set();
  (STATE.in_scope_customers || []).forEach(c => {
    if (c.theater) regions.add(c.theater);
  });
  return Array.from(regions).sort();
}

function customerTheater(name) {
  const match = (STATE.in_scope_customers || []).find(c => c.name === name);
  return match ? match.theater : null;
}

function visibleCustomerNames() {
  let names = (STATE.in_scope_customers || []).map(c => c.name);
  if (filterMyCustomers) names = names.filter(n => MY_CUSTOMER_NAMES.has(n));
  if (filterRegion) names = names.filter(n => customerTheater(n) === filterRegion);
  return names;
}

function onRegionFilterChange() {
  filterRegion = document.getElementById('region-filter').value;
  localStorage.setItem('env-tab:region', filterRegion);
  renderCustomerSelect();
}

function toggleMyCustomers() {
  filterMyCustomers = !filterMyCustomers;
  localStorage.setItem('env-tab:my-customers', filterMyCustomers ? '1' : '0');
  renderCustomerSelect();
}

function renderCustomerSelect() {
  const select = document.getElementById('customer-select');
  const regionSelect = document.getElementById('region-filter');
  const myCustomersBtn = document.getElementById('my-customers-toggle');
  const content = document.getElementById('content');

  myCustomersBtn.classList.toggle('active', filterMyCustomers);

  if (STATE.needs_pat) {
    select.innerHTML = '<option value="">—</option>';
    content.innerHTML = '<div class="hint">Add your Asana PAT in Settings to load the customer list.</div>';
    return;
  }
  if (STATE.in_scope_customers === null) {
    select.innerHTML = '<option value="">—</option>';
    content.innerHTML = `<div class="hint" style="color:var(--bad-t)">${esc(STATE.error || 'Could not determine the customer list.')}</div>`;
    return;
  }
  if (!STATE.in_scope_customers.length) {
    select.innerHTML = '<option value="">—</option>';
    content.innerHTML = '<div class="empty">No customers found in the Environments portfolio.</div>';
    return;
  }

  const regions = allRegions();
  if (filterRegion && !regions.includes(filterRegion)) {
    filterRegion = '';
    localStorage.setItem('env-tab:region', '');
  }
  regionSelect.innerHTML = '<option value="">All regions</option>' +
    regions.map(r => `<option value="${escAttr(r)}" ${r === filterRegion ? 'selected' : ''}>${esc(r)}</option>`).join('');

  const names = visibleCustomerNames();
  if (!names.length) {
    select.innerHTML = '<option value="">—</option>';
    content.innerHTML = '<div class="empty">No customers match the current filters.</div>';
    CURRENT = null;
    return;
  }

  select.innerHTML = names.map(name =>
    `<option value="${escAttr(name)}">${esc(name)}</option>`
  ).join('');
  if (!CURRENT || !names.includes(CURRENT)) CURRENT = names[0];
  select.value = CURRENT;
  ensureCustomer(CURRENT);
  renderCustomer();
}

function onCustomerChange() {
  CURRENT = document.getElementById('customer-select').value;
  ensureCustomer(CURRENT);
  renderCustomer();
}

function ensureCustomer(name) {
  if (!STATE.customers[name]) {
    STATE.customers[name] = {teams: [], environments: []};
  }
  const c = STATE.customers[name];
  c.teams = (c.teams || []).map(normalizeTeam);
  c.environments = (c.environments || []).map(normalizeEnvironment);
}

function renderCustomer() {
  loadExpandedIds(CURRENT);
  addTeamDraft = {existingEnvIds: new Set(), newEnvs: []};
  const c = STATE.customers[CURRENT];
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head"><span>Teams</span></div>
      <div class="panel-body" id="teams-body">${teamCardsHtml(c)}</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span>Environments</span>
        <button class="btn primary" onclick="addEnvironment()">Add environment</button>
      </div>
      <div class="panel-body" id="envs-body">${environmentsHtml(c)}</div>
    </div>
  `;
  wireTeamCheckboxes();
  wireNewEnvSelect();
  wireCarets();
}

function wireTeamCheckboxes() {
  // Delegated via data-* attributes rather than an inline onchange with an
  // interpolated team id: HTML-entity-escaping a value that lands inside a
  // single-quoted JS string in an inline handler doesn't actually protect
  // it, since the browser decodes entities before compiling the handler as
  // JS. A plain data attribute only needs standard HTML-attribute escaping.
  document.querySelectorAll('.team-check').forEach(cb => {
    cb.addEventListener('change', function() {
      toggleEnvTeam(parseInt(this.dataset.envIdx, 10), this.dataset.teamId, this.checked);
    });
  });
}

function teamCardsHtml(c) {
  const cards = c.teams.map((t, i) => teamCardHtml(t, i)).join('') ||
    '<div class="empty" style="padding:8px 0;">No teams yet</div>';
  return cards + addTeamPanelHtml(c);
}

function teamCardHtml(team, idx) {
  const collapsed = isExpanded(team.id) ? '' : 'collapsed';
  return `
    <div class="team-card">
      <div class="team-card-head">
        ${caretHtml(team.id)}
        <input type="text" value="${escAttr(team.name)}" onchange="updateTeamField(${idx}, 'name', this.value)">
        <button class="btn danger" onclick="removeTeam(${idx})">Remove</button>
      </div>
      <div class="team-card-body collapsible-body ${collapsed}">
        <div class="field"><label>Notes</label><textarea onchange="updateTeamField(${idx}, 'notes', this.value)">${esc(team.notes || '')}</textarea></div>
        <div class="field">
          <label>Members</label>
          ${memberRowsHtml(idx, team.members)}
        </div>
      </div>
    </div>
  `;
}

function memberRowsHtml(teamIdx, members) {
  const rows = (members || []).map((m, i) => `
    <div class="member-row">
      <input type="text" placeholder="Name" value="${escAttr(m.name || '')}" onchange="updateMemberField(${teamIdx}, ${i}, 'name', this.value)">
      <input type="text" placeholder="Title" value="${escAttr(m.title || '')}" onchange="updateMemberField(${teamIdx}, ${i}, 'title', this.value)">
      <input type="text" placeholder="Email" value="${escAttr(m.email || '')}" onchange="updateMemberField(${teamIdx}, ${i}, 'email', this.value)">
      <input type="text" placeholder="Notes" value="${escAttr(m.notes || '')}" onchange="updateMemberField(${teamIdx}, ${i}, 'notes', this.value)">
      <button class="btn danger" onclick="removeMember(${teamIdx}, ${i})">Remove</button>
    </div>
  `).join('');
  return rows + `<button class="btn" onclick="addMember(${teamIdx})">Add member</button>`;
}

function addMember(teamIdx) {
  const team = STATE.customers[CURRENT].teams[teamIdx];
  team.members = team.members || [];
  team.members.push({name: '', title: '', email: '', notes: ''});
  markDirty();
  renderCustomer();
}

function updateMemberField(teamIdx, memberIdx, field, value) {
  STATE.customers[CURRENT].teams[teamIdx].members[memberIdx][field] = value;
  markDirty();
}

function removeMember(teamIdx, memberIdx) {
  STATE.customers[CURRENT].teams[teamIdx].members.splice(memberIdx, 1);
  markDirty();
  renderCustomer();
}

function addTeamPanelHtml(c) {
  return `<div class="add-team-panel" id="add-team-panel">${addTeamPanelInnerHtml(c)}</div>`;
}

function addTeamPanelInnerHtml(c) {
  const existingChecks = c.environments.length
    ? `<div class="env-pick-list">${c.environments.map(env => `
        <label><input type="checkbox" class="add-team-env-check" data-env-id="${escAttr(env.id)}" ${addTeamDraft.existingEnvIds.has(env.id) ? 'checked' : ''}> ${esc(env.label)}</label>
      `).join('')}</div>`
    : '<div class="hint" style="padding:0;">No existing environments for this customer yet</div>';

  const pendingChips = addTeamDraft.newEnvs.length
    ? `<div class="pending-env-list">${addTeamDraft.newEnvs.map((name, i) => `
        <span class="pending-env-chip">${esc(name)}<button type="button" onclick="removePendingNewEnv(${i})">&times;</button></span>
      `).join('')}</div>`
    : '';

  return `
    <div class="add-row">
      <input type="text" id="new-team-name" placeholder="Team name">
      <input type="text" id="new-team-notes" placeholder="Notes (optional)">
    </div>
    <div class="field" style="margin-top:8px;">
      <label>Link existing environments</label>
      ${existingChecks}
    </div>
    <div class="field">
      <label>Create new environments for this team</label>
      <div class="add-row" style="border-top:none;margin-top:0;padding-top:0;">
        <select id="new-env-standard-select">
          ${STANDARD_ENV_NAMES.map(n => `<option value="${escAttr(n)}">${esc(n)}</option>`).join('')}
          <option value="__custom__">Custom…</option>
        </select>
        <input type="text" id="new-env-custom-name" placeholder="Custom environment name" style="display:none;">
        <button type="button" class="btn" onclick="queuePendingNewEnv()">+ Add</button>
      </div>
      ${pendingChips}
    </div>
    <div class="add-row">
      <button class="btn primary" onclick="addTeam()">Add team</button>
    </div>
  `;
}

function renderAddTeamPanel() {
  const c = STATE.customers[CURRENT];
  document.getElementById('add-team-panel').innerHTML = addTeamPanelInnerHtml(c);
  wireNewEnvSelect();
}

function wireNewEnvSelect() {
  const sel = document.getElementById('new-env-standard-select');
  const custom = document.getElementById('new-env-custom-name');
  if (sel) {
    sel.addEventListener('change', () => {
      custom.style.display = sel.value === '__custom__' ? '' : 'none';
    });
  }
  document.querySelectorAll('.add-team-env-check').forEach(cb => {
    cb.addEventListener('change', function() {
      toggleAddTeamExistingEnv(this.dataset.envId, this.checked);
    });
  });
}

function toggleAddTeamExistingEnv(envId, checked) {
  if (checked) addTeamDraft.existingEnvIds.add(envId);
  else addTeamDraft.existingEnvIds.delete(envId);
}

function queuePendingNewEnv() {
  const sel = document.getElementById('new-env-standard-select');
  const custom = document.getElementById('new-env-custom-name');
  const name = sel.value === '__custom__' ? custom.value.trim() : sel.value;
  if (!name) return;
  addTeamDraft.newEnvs.push(name);
  custom.value = '';
  renderAddTeamPanel();
}

function removePendingNewEnv(idx) {
  addTeamDraft.newEnvs.splice(idx, 1);
  renderAddTeamPanel();
}

function addTeam() {
  const nameInput = document.getElementById('new-team-name');
  const notesInput = document.getElementById('new-team-notes');
  const name = nameInput.value.trim();
  if (!name) return;
  const id = 'team-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now();
  const team = {id, name, notes: notesInput.value.trim(), members: []};
  const c = STATE.customers[CURRENT];
  c.teams.push(team);
  expandedIds.add(id);
  expandedIds.add('group-' + id);

  c.environments.forEach(env => {
    if (addTeamDraft.existingEnvIds.has(env.id)) {
      env.team_ids = env.team_ids || [];
      if (!env.team_ids.includes(id)) env.team_ids.push(id);
    }
  });

  addTeamDraft.newEnvs.forEach((label, i) => {
    const envId = 'env-' + Date.now() + '-' + i;
    c.environments.push({
      id: envId,
      label,
      team_ids: [id],
      deployment: {model: 'SaaS', install_method: '', region: '', multi_tenancy: '', sizing: ''},
      versions: {camunda_version: '', components: []},
      links: {console_url: '', cluster_urls: [], support_plan: '', runbook_links: []},
      notes: '',
      diagnostic_reports: [],
      helm_values: [],
    });
    expandedIds.add(envId);
  });

  addTeamDraft = {existingEnvIds: new Set(), newEnvs: []};
  saveExpandedIds();
  markDirty();
  renderCustomer();
}

function updateTeamField(idx, field, value) {
  STATE.customers[CURRENT].teams[idx][field] = value;
  markDirty();
}

function removeTeam(idx) {
  const team = STATE.customers[CURRENT].teams[idx];
  if (!confirm(`Remove team "${team.name}"? It will also be unlinked from any environment.`)) return;
  STATE.customers[CURRENT].teams.splice(idx, 1);
  STATE.customers[CURRENT].environments.forEach(env => {
    env.team_ids = (env.team_ids || []).filter(id => id !== team.id);
  });
  markDirty();
  renderCustomer();
}

function environmentsHtml(c) {
  if (!c.environments.length) return '<div class="empty">No environments yet</div>';

  const indexed = c.environments.map((env, idx) => ({env, idx}));
  const groups = c.teams.map(team => ({
    id: 'group-' + team.id,
    label: team.name,
    entries: indexed.filter(({env}) => (env.team_ids || []).includes(team.id)),
  }));

  const validTeamIds = new Set(c.teams.map(t => t.id));
  const unassigned = indexed.filter(
    ({env}) => !(env.team_ids || []).some(id => validTeamIds.has(id))
  );
  groups.push({id: 'group-unassigned', label: 'Unassigned', entries: unassigned});

  return groups
    .filter(g => g.entries.length)
    .map(g => environmentGroupHtml(g, c.teams))
    .join('');
}

function environmentGroupHtml(group, teams) {
  const collapsed = isExpanded(group.id) ? '' : 'collapsed';
  const cards = group.entries.map(({env, idx}) => environmentCardHtml(env, idx, teams)).join('');
  return `
    <div class="env-group">
      <div class="group-head">
        ${caretHtml(group.id)}
        <span>${esc(group.label)} (${group.entries.length})</span>
      </div>
      <div class="group-body collapsible-body ${collapsed}">${cards}</div>
    </div>
  `;
}

function environmentCardHtml(env, idx, teams) {
  const teamChecks = teams.map(t => `
    <label><input type="checkbox" class="team-check" data-env-idx="${idx}" data-team-id="${escAttr(t.id)}" ${((env.team_ids||[]).includes(t.id)) ? 'checked' : ''}> ${esc(t.name)}</label>
  `).join('') || '<span class="hint" style="padding:0">No teams defined yet</span>';

  const componentChecks = COMPONENT_OPTIONS.map(comp => `
    <label><input type="checkbox" ${((env.versions.components||[]).includes(comp)) ? 'checked' : ''}
      onchange="toggleEnvComponent(${idx}, '${comp}', this.checked)"> ${comp}</label>
  `).join('');

  const collapsed = isExpanded(env.id) ? '' : 'collapsed';
  return `
    <div class="env-card">
      <div class="env-card-head">
        ${caretHtml(env.id)}
        <input type="text" value="${escAttr(env.label)}" onchange="updateEnvField(${idx}, 'label', this.value)" style="font-weight:600;font-size:12.5px;">
        <button class="btn danger" onclick="removeEnvironment(${idx})">Remove</button>
      </div>
      <div class="env-card-body collapsible-body ${collapsed}">
        <div class="field"><label>Teams</label><div class="team-checks">${teamChecks}</div></div>
        <div class="field-grid">
          <div><label>Deployment model</label>
            <select onchange="updateEnvNested(${idx}, 'deployment', 'model', this.value)">
              <option value="SaaS" ${env.deployment.model==='SaaS'?'selected':''}>SaaS</option>
              <option value="Self-Managed" ${env.deployment.model==='Self-Managed'?'selected':''}>Self-Managed</option>
            </select>
          </div>
          <div><label>Install method</label><input type="text" value="${escAttr(env.deployment.install_method)}" onchange="updateEnvNested(${idx}, 'deployment', 'install_method', this.value)"></div>
          <div><label>Region</label><input type="text" value="${escAttr(env.deployment.region)}" onchange="updateEnvNested(${idx}, 'deployment', 'region', this.value)"></div>
          <div><label>Multi-tenancy</label><input type="text" value="${escAttr(env.deployment.multi_tenancy)}" onchange="updateEnvNested(${idx}, 'deployment', 'multi_tenancy', this.value)"></div>
          <div><label>Sizing</label><input type="text" value="${escAttr(env.deployment.sizing)}" onchange="updateEnvNested(${idx}, 'deployment', 'sizing', this.value)"></div>
          <div><label>Camunda version</label><input type="text" value="${escAttr(env.versions.camunda_version)}" onchange="updateEnvNested(${idx}, 'versions', 'camunda_version', this.value)"></div>
        </div>
        <div class="field"><label>Components</label><div class="team-checks">${componentChecks}</div></div>
        <div class="field-grid">
          <div><label>Console URL</label><input type="text" value="${escAttr(env.links.console_url)}" onchange="updateEnvNested(${idx}, 'links', 'console_url', this.value)"></div>
          <div><label>Support plan</label><input type="text" value="${escAttr(env.links.support_plan)}" onchange="updateEnvNested(${idx}, 'links', 'support_plan', this.value)"></div>
        </div>
        <div class="field"><label>Cluster URLs (one per line)</label><textarea onchange="updateEnvListField(${idx}, 'links', 'cluster_urls', this.value)">${esc((env.links.cluster_urls||[]).join('\n'))}</textarea></div>
        <div class="field"><label>Runbook links (one per line)</label><textarea onchange="updateEnvListField(${idx}, 'links', 'runbook_links', this.value)">${esc((env.links.runbook_links||[]).join('\n'))}</textarea></div>
        <div class="field"><label>Notes</label><textarea onchange="updateEnvField(${idx}, 'notes', this.value)">${esc(env.notes || '')}</textarea></div>
        <div class="field"><label>Diagnostic reports</label>${datedListHtml(idx, 'diagnostic_reports', env.diagnostic_reports, true)}</div>
        <div class="field"><label>Helm values.yaml history</label>${datedListHtml(idx, 'helm_values', env.helm_values, false)}</div>
      </div>
    </div>
  `;
}

function datedListHtml(envIdx, key, rows, withTicket) {
  const rowsHtml = (rows || []).map((row, rowIdx) => `
    <div class="dated-list-row">
      <input type="text" placeholder="Link" value="${escAttr(row.link || '')}" onchange="updateDatedListField(${envIdx}, '${key}', ${rowIdx}, 'link', this.value)">
      <input type="date" class="date-input" value="${escAttr((withTicket ? row.generated_date : row.date) || '')}" onchange="updateDatedListField(${envIdx}, '${key}', ${rowIdx}, '${withTicket ? 'generated_date' : 'date'}', this.value)">
      ${withTicket ? `<input type="text" class="ticket-input" placeholder="Ticket" value="${escAttr(row.ticket || '')}" onchange="updateDatedListField(${envIdx}, '${key}', ${rowIdx}, 'ticket', this.value)">` : ''}
      <button class="btn danger" onclick="removeDatedListRow(${envIdx}, '${key}', ${rowIdx})">Remove</button>
    </div>
  `).join('');
  return rowsHtml + `<button class="btn" onclick="addDatedListRow(${envIdx}, '${key}', ${withTicket})">Add</button>`;
}

function addEnvironment() {
  const label = prompt('Environment label (e.g. Production, Staging):');
  if (!label || !label.trim()) return;
  const id = 'env-' + Date.now();
  STATE.customers[CURRENT].environments.push({
    id,
    label: label.trim(),
    team_ids: [],
    deployment: {model: 'SaaS', install_method: '', region: '', multi_tenancy: '', sizing: ''},
    versions: {camunda_version: '', components: []},
    links: {console_url: '', cluster_urls: [], support_plan: '', runbook_links: []},
    notes: '',
    diagnostic_reports: [],
    helm_values: [],
  });
  expandedIds.add(id);
  expandedIds.add('group-unassigned');
  saveExpandedIds();
  markDirty();
  renderCustomer();
}

function removeEnvironment(idx) {
  const env = STATE.customers[CURRENT].environments[idx];
  if (!confirm(`Remove environment "${env.label}"?`)) return;
  STATE.customers[CURRENT].environments.splice(idx, 1);
  markDirty();
  renderCustomer();
}

function updateEnvField(idx, field, value) {
  STATE.customers[CURRENT].environments[idx][field] = value;
  markDirty();
}

function updateEnvNested(idx, group, field, value) {
  STATE.customers[CURRENT].environments[idx][group][field] = value;
  markDirty();
}

function updateEnvListField(idx, group, field, textareaValue) {
  STATE.customers[CURRENT].environments[idx][group][field] =
    textareaValue.split('\n').map(s => s.trim()).filter(Boolean);
  markDirty();
}

function toggleEnvTeam(idx, teamId, checked) {
  const env = STATE.customers[CURRENT].environments[idx];
  env.team_ids = env.team_ids || [];
  if (checked) {
    if (!env.team_ids.includes(teamId)) env.team_ids.push(teamId);
  } else {
    env.team_ids = env.team_ids.filter(id => id !== teamId);
  }
  markDirty();
}

function toggleEnvComponent(idx, comp, checked) {
  const env = STATE.customers[CURRENT].environments[idx];
  env.versions.components = env.versions.components || [];
  if (checked) {
    if (!env.versions.components.includes(comp)) env.versions.components.push(comp);
  } else {
    env.versions.components = env.versions.components.filter(c => c !== comp);
  }
  markDirty();
}

function addDatedListRow(envIdx, key, withTicket) {
  const env = STATE.customers[CURRENT].environments[envIdx];
  env[key] = env[key] || [];
  env[key].push(withTicket ? {link: '', generated_date: '', ticket: ''} : {link: '', date: ''});
  markDirty();
  renderCustomer();
}

function removeDatedListRow(envIdx, key, rowIdx) {
  STATE.customers[CURRENT].environments[envIdx][key].splice(rowIdx, 1);
  markDirty();
  renderCustomer();
}

function updateDatedListField(envIdx, key, rowIdx, field, value) {
  STATE.customers[CURRENT].environments[envIdx][key][rowIdx][field] = value;
  markDirty();
}

function markDirty() {
  dirty = true;
  document.getElementById('save-btn').disabled = false;
  document.getElementById('save-status').textContent = 'Unsaved changes';
}

async function saveAll() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  status.textContent = 'Saving…';
  try {
    const r = await fetch(`${BASE}api/environments/config`, {
      method: 'PUT', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({customers: STATE.customers}),
    });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    dirty = false;
    status.textContent = '';
    showToast('Saved to Drive', 'ok', 4000);
  } catch(e) {
    showToast('Save failed: ' + e.message, 'err', 5000);
    status.textContent = 'Unsaved changes';
    btn.disabled = false;
  }
}

function showToast(text, type, duration) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = text;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove());
  }, duration);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function escAttr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

load();
</script>
</body>
</html>
