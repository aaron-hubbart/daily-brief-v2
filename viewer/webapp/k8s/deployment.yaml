apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-brief-viewer
  namespace: daily-brief-v2
  labels:
    app: daily-brief-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daily-brief-viewer
  template:
    metadata:
      labels:
        app: daily-brief-viewer
    spec:
      serviceAccountName: daily-brief-viewer
      containers:
        - name: daily-brief-viewer
          image: gcr.io/tam-aaron-hubbart/daily-brief-viewer:latest
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: FLASK_SECRET_KEY
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: AZURE_TENANT_ID
            # Plain value, not a secret — matches the dashboard app's own
            # pattern of keeping the redirect URI as a visible env value.
            # Includes the /daily-brief-v2 prefix this app is mounted at (see
            # ingress.yaml) — must exactly match the Redirect URI registered
            # on the app registration in the Azure Portal.
            - name: AZURE_REDIRECT_URI
              value: "https://dashboard.es-sandbox.com/daily-brief-v2/auth/callback"
            # Plain value, not a secret (just an allowlist of email
            # addresses) — comma-separated emails allowed to reach /admin.
            # Unset (empty) disables the admin panel entirely. Edit this
            # value directly and re-apply/rollout-restart to change it;
            # not worth a Secret for something this low-sensitivity.
            - name: ADMIN_EMAILS
              value: "aaron.hubbart@camunda.com"
            # Built from postgres-credentials via $(VAR) interpolation
            # (supported natively by Kubernetes for env vars defined earlier
            # in the same list) rather than duplicating the connection
            # string as a second secret that could drift out of sync with
            # the StatefulSet's own credentials.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: APP_PATH_PREFIX
              value: "/daily-brief-v2"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: GOOGLE_CLIENT_SECRET
            # Off by default (empty = no shared cookie, /internal/sso/verify
            # 404s). Flip to "dashboard.es-sandbox.com" only once the TAM
            # Dashboard's Express proxy is actually calling that endpoint —
            # see viewer/webapp/DEPLOYMENT.md's SSO section.
            - name: SSO_COOKIE_DOMAIN
              value: ""
            # optional: true — this key doesn't exist in the live Secret
            # until DEPLOYMENT.md's SSO step is run; without optional, a
            # missing key here would crash-loop the pod (CreateContainerConfigError)
            # instead of just leaving the SSO feature off.
            - name: INTERNAL_SSO_SECRET
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: INTERNAL_SSO_SECRET
                  optional: true
            # optional: true — same reasoning as INTERNAL_SSO_SECRET above:
            # this key won't exist in the live Secret until DEPLOYMENT.md's
            # "Enabling Post to Slack" step is run, and it should just leave
            # that feature off (503) rather than crash-loop the pod.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: daily-brief-secrets
                  key: SLACK_BOT_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-brief-viewer
  namespace: daily-brief-v2
  annotations:
    iam.gke.io/gcp-service-account: daily-brief-viewer@tam-aaron-hubbart.iam.gserviceaccount.com
