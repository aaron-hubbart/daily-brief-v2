apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daily-brief-viewer
  namespace: daily-brief-v2
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Strip the /daily-brief-v2 prefix before it reaches the app -- app.py's
    # routes are defined at root (/login, /healthz, etc.), not under a
    # prefix. $2 is the part of the path after /daily-brief-v2. (Unlike v1's
    # ingress, this deliberately does NOT carry forward the
    # proxy-set-headers/X-Forwarded-Prefix ConfigMap annotation -- v1's own
    # app.py docstring documents that annotation as non-functional per-Ingress
    # on this cluster; app.py's ForcePrefixMiddleware hardcodes the prefix
    # instead and doesn't depend on it.)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.es-sandbox.com
      # Separate secret from both the dashboard app's and v1's own TLS
      # secrets -- Secrets are namespace-scoped, so this namespace needs
      # (and cert-manager will independently issue) its own certificate for
      # the same hostname. Multiple certs for one domain across namespaces
      # is a normal pattern here, not a conflict.
      secretName: daily-brief-v2-tls
  rules:
    - host: dashboard.es-sandbox.com
      http:
        paths:
          - path: /daily-brief-v2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: daily-brief-viewer
                port:
                  number: 8000
